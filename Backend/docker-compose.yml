services:
  backend:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg2://finsentry:finsentry@postgres:5432/finsentry
    depends_on: [postgres]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: finsentry
      POSTGRES_PASSWORD: finsentry
      POSTGRES_DB: finsentry
    ports: ["5432:5432"]
